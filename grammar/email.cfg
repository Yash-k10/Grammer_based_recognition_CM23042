# Context-Free Grammar (CFG / BNF) for Email Pattern Recognition
# Pattern Structure: EMAIL -> LOCAL "@" DOMAIN "." TLD

EMAIL -> LOCAL AT DOMAIN DOT TLD
LOCAL -> WORD | WORD SEP LOCAL
DOMAIN -> WORD | WORD HYPHEN DOMAIN

AT -> '@'
DOT -> '.'
HYPHEN -> '-'
SEP -> '.' | '_' | '-' | '+'
WORD -> 'WORD' | 'ALPHANUM' | 'LETTERS' | 'DIGITS'
TLD -> 'com' | 'org' | 'net' | 'edu' | 'gov' | 'io' | 'co' | 'in' | 'info' | 'biz' | 'dev' | 'ai' | 'TLD'
