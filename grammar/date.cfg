# Context-Free Grammar (CFG / BNF) for Date Pattern Recognition
# Pattern Structure: 
#   DATE -> YEAR SEP MONTH SEP DAY | DAY SEP MONTH SEP YEAR
# Supports ISO (YYYY-MM-DD, YYYY/MM/DD, YYYY.MM.DD) and European/Standard formats (DD-MM-YYYY, DD/MM/YYYY, DD.MM.YYYY)

DATE -> YEAR SEP MONTH SEP DAY | DAY SEP MONTH SEP YEAR
YEAR -> DIGIT4
MONTH -> DIGIT2
DAY -> DIGIT2

SEP -> '-' | '/' | '.'
DIGIT4 -> 'DIGIT4'
DIGIT2 -> 'DIGIT2'
